server:
  port: 8090

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/examportal}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Admin}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt:
    secret: "exam-portal-super-secret-signing-key-change-this-in-production-123456"
    expiration-ms: 28800000   # 8 hours
  # Admin login created on first run if the users table is empty.
  # No student accounts or exam records are seeded — add them from the admin panel.
  seed:
    admin-id: ${ADMIN_ID:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
